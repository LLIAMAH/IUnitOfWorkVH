
name: Build, Test and Publish NuGet

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore IUnitOfWorkVH.sln

      - name: Build
        run: dotnet build IUnitOfWorkVH.sln -c Release --no-restore

      - name: Run Unit Tests
        run: >
          dotnet test IUnitOfWorkVH.Tests/IUnitOfWorkVH.Tests.csproj
          -c Release --no-build --no-restore

  publish:
    name: Pack and Publish NuGet
    if: github.event_name == 'release'
    needs: build-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Determine Package Version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_TAG"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore IUnitOfWorkVH.sln

      - name: Build
        run: dotnet build IUnitOfWorkVH.sln -c Release --no-restore

      - name: Run Unit Tests
        run: >
          dotnet test IUnitOfWorkVH.Tests/IUnitOfWorkVH.Tests.csproj
          -c Release --no-build --no-restore

      - name: Pack IUnitOfWorkVH
        run: >
          dotnet pack IUnitOfWorkVH/IUnitOfWorkVH.csproj
          -c Release --no-build --no-restore
          -o ./artifacts
          -p:PackageVersion="$VERSION"

      - name: Pack IUnitOfWorkVH.Abstractions
        run: >
          dotnet pack IUnitOfWorkVH.Abstractions/IUnitOfWorkVH.Abstractions.csproj
          -c Release --no-build --no-restore
          -o ./artifacts
          -p:PackageVersion="$VERSION"

      - name: NuGet Trusted Login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet Packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
